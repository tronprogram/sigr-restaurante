<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SIGR Restaurante{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f9; color: #1f2937; }
    header { background: #1e3a8a; color: #fff; padding: 14px 24px; display: flex; gap: 24px; align-items: center; }
    header a { color: #fff; text-decoration: none; font-weight: 500; }
    header strong { margin-right: auto; font-size: 18px; }
    .ambiente { padding: 6px 24px; font-size: 13px; font-weight: 600; }
    .ambiente-produccion { background: #dcfce7; color: #166534; }
    .ambiente-staging { background: #fef3c7; color: #92400e; }
    .ambiente-local, .ambiente-pruebas { background: #e5e7eb; color: #374151; }
    main { max-width: 820px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 4px; }
    button { margin-top: 18px; padding: 10px 18px; background: #1e3a8a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .error { color: #b91c1c; font-size: 13px; margin-top: 4px; }
    .exito { background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    footer { text-align: center; font-size: 12px; color: #6b7280; margin-bottom: 24px; }
  </style>
</head>
<body>
  <header>
    <strong>SIGR Restaurante</strong>
    <a href="/reservas">Reservas</a>
    <a href="/pedidos">Pedidos en linea</a>
    <a href="/api/mesas">API Mesas</a>
    <a href="/api/salud">Salud</a>
  </header>
  <div class="ambiente ambiente-{{ ambiente }}" id="ambiente">Ambiente: {{ ambiente }} &middot; version {{ version }}</div>
  <main>{% block contenido %}{% endblock %}</main>
  <footer id="version">SIGR Restaurante v{{ version }}</footer>
</body>
</html>
